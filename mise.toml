[tools]
node = "24.16.0"
# Rust intentionally tracks the stable channel for this Rust library.
rust = { version = "stable", profile = "minimal", components = "clippy,rustfmt" }
zizmor = "1.25.2"

"cargo:cargo-deny" = "0.19.6"
"cargo:cargo-mutants" = "27.0.0"
"cargo:cargo-outdated" = "0.19.0"

[hooks]
postinstall = "corepack enable"

[settings]
experimental = true

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.pnpm-install]
description = "Install dependencies with pnpm when lockfile changes"
run = "pnpm install"
sources = ["package.json", "pnpm-lock.yaml", "mise.toml"]
outputs = ["node_modules/.pnpm/lock.yaml"]
