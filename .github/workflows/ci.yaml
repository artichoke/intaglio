---
name: CI
"on":
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
  schedule:
    - cron: "0 0 * * WED"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read # needed to checkout contents
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026, macos-26, macos-26-intel]
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
          - os: macos-26
            target: aarch64-apple-darwin
          - os: macos-26-intel
            target: x86_64-apple-darwin
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Compile
        run: cargo build --verbose

      - name: Compile tests
        run: cargo test --no-run

      - name: Test
        run: cargo test

      - name: Test with all features
        run: cargo test --all-features

      - name: Test with no default features
        run: cargo test --no-default-features

  build_x86:
    name: Build 32-bit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
        include:
          - os: ubuntu-24.04
            target: i686-unknown-linux-gnu
          - os: windows-2025-vs2026
            target: i686-pc-windows-msvc
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
      CI_TARGET_TRIPLE: ${{ matrix.target }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target "$CI_TARGET_TRIPLE"
          rustup default stable
        shell: bash

      - name: Install 32-bit platform support
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt install gcc-multilib

      - name: Compile
        run: cargo build --verbose --target "$CI_TARGET_TRIPLE"
        shell: bash

      - name: Compile tests
        run: cargo test --no-run --target "$CI_TARGET_TRIPLE"
        shell: bash

      - name: Test
        run: cargo test --target "$CI_TARGET_TRIPLE"
        shell: bash

      - name: Test with all features
        run: cargo test --all-features --target "$CI_TARGET_TRIPLE"
        shell: bash

      - name: Test with no default features
        run: cargo test --no-default-features --target "$CI_TARGET_TRIPLE"
        shell: bash

  build-msrv:
    name: Build (MSRV)
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0

      - name: Compile
        run: cargo build --verbose

      - name: Compile tests
        run: cargo test --no-run

      - name: Test
        run: cargo test

      - name: Test with all features
        run: cargo test --all-features

      - name: Test with no default features
        run: cargo test --no-default-features

  leaksan:
    name: Leak sanitizer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
      CI_TARGET_TRIPLE: ${{ matrix.target }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly --profile minimal --target "$CI_TARGET_TRIPLE"
          rustup default nightly
        shell: bash

      - name: Test with leak sanitizer and all features
        # LeakSanitzier is broken: https://github.com/rust-lang/rust/issues/111073
        if: false
        run: cargo test --all-features --target "$CI_TARGET_TRIPLE"
        env:
          RUSTFLAGS: "-Z sanitizer=leak"
          CI_TARGET_TRIPLE: ${{ matrix.target }}

  rust:
    name: Lint and format Rust
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt
          rustup default nightly

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Check formatting
        run: cargo +nightly fmt --check

      - name: Lint with Clippy
        run: cargo clippy --workspace --all-features --all-targets

      - name: Check docs with no default features
        run: cargo +nightly doc --workspace --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links --cfg docsrs

      - name: Check docs
        run: cargo +nightly doc --workspace
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links --cfg docsrs

  text:
    name: Lint and format text
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false

      - name: Setup Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.16.0"
          cache: pnpm

      - name: Install toolchain
        run: pnpm install --frozen-lockfile

      - name: Format with prettier
        run: pnpm exec prettier --check '**/*'
