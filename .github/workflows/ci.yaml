---
name: CI
"on":
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
  schedule:
    - cron: "0 0 * * WED"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read # needed to checkout contents
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Compile
        run: cargo build --verbose

      - name: Compile tests
        run: cargo test --no-run

      - name: Test
        run: cargo test

      - name: Test with all features
        run: cargo test --all-features

      - name: Test with no default features
        run: cargo test --no-default-features

  build_x86:
    name: Build 32-bit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
          - os: windows-latest
            target: i686-pc-windows-msvc
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
      CI_TARGET_TRIPLE: ${{ matrix.target }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target "$CI_TARGET_TRIPLE"
          rustup default stable
        shell: bash

      - name: Install 32-bit platform support
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt install gcc-multilib

      - name: Compile
        run: cargo build --verbose --target "$CI_TARGET_TRIPLE"
        shell: bash

      - name: Compile tests
        run: cargo test --no-run --target "$CI_TARGET_TRIPLE"
        shell: bash

      - name: Test
        run: cargo test --target "$CI_TARGET_TRIPLE"
        shell: bash

      - name: Test with all features
        run: cargo test --all-features --target "$CI_TARGET_TRIPLE"
        shell: bash

      - name: Test with no default features
        run: cargo test --no-default-features --target "$CI_TARGET_TRIPLE"
        shell: bash

  build-msrv:
    name: Build (MSRV)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0

      - name: Compile
        run: cargo build --verbose

      - name: Compile tests
        run: cargo test --no-run

      - name: Test
        run: cargo test

      - name: Test with all features
        run: cargo test --all-features

      - name: Test with no default features
        run: cargo test --no-default-features

  leaksan:
    name: Leak sanitizer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
      CI_TARGET_TRIPLE: ${{ matrix.target }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly --profile minimal --target "$CI_TARGET_TRIPLE"
          rustup default nightly
        shell: bash

      - name: Test with leak sanitizer and all features
        # LeakSanitzier is broken: https://github.com/rust-lang/rust/issues/111073
        if: false
        run: cargo test --all-features --target "$CI_TARGET_TRIPLE"
        env:
          RUSTFLAGS: "-Z sanitizer=leak"
          CI_TARGET_TRIPLE: ${{ matrix.target }}

  rust:
    name: Lint and format Rust
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt
          rustup default nightly

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Check formatting
        run: cargo +nightly fmt --check

      - name: Lint with Clippy
        run: cargo clippy --workspace --all-features --all-targets

  text:
    name: Lint and format text
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "lts/*"

      - name: Install toolchain
        run: npm ci

      - name: Format with prettier
        run: npx prettier --check '**/*'
