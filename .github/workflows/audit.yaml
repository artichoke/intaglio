---
name: Audit
"on":
  pull_request:
    branches:
      - trunk
  schedule:
    - cron: "0 0 * * TUE"
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read # required to checkout repository
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      workflows: ${{ steps.changes.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          rust=false
          workflows=false

          while IFS= read -r file; do
            if [[ "$file" == *.rs ||
                  "$file" == "Cargo.toml" ||
                  "$file" == "Cargo.lock" ||
                  "$file" == "deny.toml" ||
                  "$file" == "mise.toml" ||
                  "$file" == ".github/workflows/audit.yaml" ]]; then
              rust=true
            fi
            if [[ "$file" == .github/workflows/* ||
                  "$file" == "mise.toml" ]]; then
              workflows=true
            fi
          done <<< "$changed_files"

          printf 'rust=%s\n' "$rust" >> "$GITHUB_OUTPUT"
          printf 'workflows=%s\n' "$workflows" >> "$GITHUB_OUTPUT"

  rust:
    name: Audit Rust Dependencies
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'schedule' || needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read # required to checkout repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Generate Cargo.lock
        run: |
          if [[ ! -f "Cargo.lock" ]]; then
            cargo generate-lockfile --verbose
          fi

      - name: Audit advisories
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --locked --all-features
          command: check advisories
          command-arguments: --show-stats

      - name: Audit bans, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --locked --all-features
          command: check bans licenses sources
          command-arguments: --show-stats

  zizmor:
    name: Run zizmor 🌈
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
      needs.changes.outputs.workflows == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read # required to checkout repository
      security-events: write # required to add findings via sarif
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve zizmor version
        id: zizmor-version
        shell: bash
        run: |
          version="$(awk -F '"' '/^[[:space:]]*zizmor[[:space:]]*=/{ print $2; exit }' mise.toml)"
          if [[ ! "${version}" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Unable to resolve exact zizmor version from mise.toml" >&2
            exit 1
          fi
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          persona: "pedantic"
          version: ${{ steps.zizmor-version.outputs.version }}
