---
name: Setup mise
description: Install the repository-pinned mise bootstrap after checksum verification
inputs:
  github-token:
    description: GitHub token used to authenticate the release download
    required: true
outputs:
  executable:
    description: Absolute path to the verified mise executable
    value: ${{ steps.install.outputs.executable }}
runs:
  using: composite
  steps:
    - name: Disable mise version download tracking
      shell: bash
      run: printf '%s\n' 'MISE_USE_VERSIONS_HOST_TRACK=false' >> "$GITHUB_ENV"

    - name: Install mise
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MISE_VERSION: "2026.10.21"
        MISE_SHA256_LINUX_X64: "e1743bb7628927f93d4ffb2c4e2c4f71186307612f59ebc7f85d52e3a7f42461"
        MISE_SHA256_MACOS_ARM64: "27755813e64f7a064e4e9c7df2332b3499fcb018a8c3ca699ec149df4aa20e8c"
        MISE_SHA256_MACOS_X64: "ec7eda34bce4a23bccf6104f5f4ab2ab798abd31a0137d28f2fe9ef2b3ead23a"
      run: '"$ACTION_PATH/setup.sh"'
