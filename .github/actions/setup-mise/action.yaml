---
name: Setup mise
description: Install the repository-pinned mise bootstrap after checksum verification
inputs:
  github-token:
    description: GitHub token used to authenticate the release download
    required: true
outputs:
  executable:
    description: Absolute path to the verified mise executable
    value: ${{ steps.install.outputs.executable }}
runs:
  using: composite
  steps:
    - name: Disable mise version download tracking
      shell: bash
      run: printf '%s\n' 'MISE_USE_VERSIONS_HOST_TRACK=false' >> "$GITHUB_ENV"

    - name: Install mise
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MISE_VERSION: "2026.10.14"
        MISE_SHA256_LINUX_X64: "1c31a411eb1a55327d578e500a121acd21d9948a8a6012a75c68868c44f540ad"
        MISE_SHA256_MACOS_ARM64: "86660549ef546a4d491c9f7829112f5f5157d5a41a660ddaab059e6284bf51fe"
        MISE_SHA256_MACOS_X64: "c1685f6bc717666a4a48f48d460ae958b66cd409a2b5fcc28a7d32cb5129ad91"
      run: '"$ACTION_PATH/setup.sh"'
